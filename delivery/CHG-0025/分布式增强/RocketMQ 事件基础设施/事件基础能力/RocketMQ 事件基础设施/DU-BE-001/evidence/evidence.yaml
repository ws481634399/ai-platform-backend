## EV-003 输出摘要（Testcontainers）

- 容器：`apache/rocketmq:5.3.4`（同 repo-4 compose 定稿版本）NameServer + Broker（brokerIP1=127.0.0.1、listenPort=20911 固定映射，避开 dev compose 栈 10909~10912）；幂等表 H2 MySQL 模式
- 7/7 通过：
  1. sendSync 送达：Tag=IT_EVENT、keys=eventId、Envelope 七字段往返一致、消费端 MDC.traceId == Envelope.traceId
  2. sendAsync 回调成功且消息送达
  3. sendDelay delayLevel=1（1s）延迟消息送达
  4. Envelope.traceId 缺失 → 生产者自动生成（32 位 hex）、消费端 MDC 可见且不阻断
  5. eventVersion=2 → maxSupportedVersion=1 消费组 WARN+ACK 拒绝（handler 未执行、投递恰好 1 次不重试），maxSupportedVersion=2 对照组正常收到
  6. 持续失败（maxReconsumeTimes=2）：删占位重试 3 次（初始+2）→ 超限进 `%DLQ%it-failing-group`，DLQ 消息体保留 Envelope 原文可查询、不静默
  7. 同 eventId 重复投递 → 真实 SQL 幂等占位生效，handler 只执行 1 次

