spring:
  application:
    name: mall-gateway

  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:}
      discovery:
        enabled: ${NACOS_ENABLED:false}
    # CHG-0010：商品服务管理端路由。本地默认直连（无 loadbalancer/注册中心），
    # 部署环境可经 MALL_GATEWAY_PRODUCT_URI=lb://mall-product 覆写为服务发现寻址
    gateway:
      routes:
        # CHG-0007 遗漏补配：身份认证与会话引导路由（设计见 CHG-0007 design.md 集成边界）
        - id: mall-identity-admin
          uri: ${MALL_GATEWAY_IDENTITY_URI:http://localhost:8101}
          predicates:
            - Path=/api/admin/auth/**,/api/admin/session/**
        # CHG-0010：商品服务管理端路由。本地默认直连（无 loadbalancer/注册中心），
        # 部署环境可经 MALL_GATEWAY_PRODUCT_URI=lb://mall-product 覆写为服务发现寻址
        - id: mall-product-admin
          uri: ${MALL_GATEWAY_PRODUCT_URI:http://localhost:8103}
          predicates:
            - Path=/api/admin/categories/**,/api/admin/brands/**
        # CHG-0011：商品 SPU/SKU 管理端路由（含 /{id}/skus 子资源），同一直连 URI
        - id: mall-product-admin-spu
          uri: ${MALL_GATEWAY_PRODUCT_URI:http://localhost:8103}
          predicates:
            - Path=/api/admin/products/**
        # CHG-0014：商城公开查询与服务间商品快照路由
        - id: mall-product-mall
          uri: ${MALL_GATEWAY_PRODUCT_URI:http://localhost:8103}
          predicates:
            - Path=/api/mall/products/**,/api/mall/categories/**,/api/mall/brands/**,/api/mall/home,/api/mall/skus/**
        # CHG-0016：会员认证端点（注册/登录/刷新/退出），直连 mall-identity
        - id: mall-identity-member
          uri: ${MALL_GATEWAY_IDENTITY_URI:http://localhost:8101}
          predicates:
            - Path=/api/auth/member/**
        # CHG-0016：会员域端点（资料/地址，随后续 Story 落 mall-member:8102）
        - id: mall-member
          uri: ${MALL_GATEWAY_MEMBER_URI:http://localhost:8102}
          predicates:
            - Path=/api/mall/members/**,/api/mall/shipping-addresses/**
        # CHG-0018 DU-BE-801：会员购物车路由（mall-cart:8104，仅 /api/mall/cart/**；
        # /api/internal/carts/** 不经网关，安全链对 /api/internal/** 统一 denyAll→404）
        - id: mall-cart
          uri: ${MALL_GATEWAY_CART_URI:http://localhost:8104}
          predicates:
            - Path=/api/mall/cart/**
        - id: mall-product-internal
          uri: ${MALL_GATEWAY_PRODUCT_URI:http://localhost:8103}
          predicates:
            - Path=/api/internal/products/**
        # CHG-0013：库存服务管理端与内部接口路由
        - id: mall-inventory-admin
          uri: ${MALL_GATEWAY_INVENTORY_URI:http://localhost:8106}
          predicates:
            - Path=/api/admin/inventory/**,/api/internal/inventory/**
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION}

server:
  port: 8080

mall:
  security:
    jwt:
      issuer: ${JWT_ISSUER:ai-platform}
      audience: ${JWT_AUDIENCE:mall-admin-api}
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION}

spring.security.oauth2.resourceserver.jwt.public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
