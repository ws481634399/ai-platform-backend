spring:
  application:
    name: mall-cart

  # CHG-0018 DU-BE-801：购物车写模型基于 Redis（Lua 原子写 + 滑动 TTL），服务无 RDBMS 数据源
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:}
      discovery:
        enabled: ${NACOS_ENABLED:false}

server:
  port: 8104

mall:
  security:
    jwt:
      issuer: ${JWT_ISSUER:ai-platform}
      audience: ${JWT_AUDIENCE:mall-admin-api}
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
    # 服务间内部接口共享凭证：仅本地开发使用默认值，生产经环境变量注入
    internal:
      shared-secret: ${MALL_INTERNAL_SHARED_SECRET:dev-internal-secret}
  cart:
    # 加购可售校验直连 mall-product（8103）；购物车不依赖 inventory
    product-uri: ${PRODUCT_SERVICE_URI:http://localhost:8103}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{40} - %msg%n"
