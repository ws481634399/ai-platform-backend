# test profile（CHG-0018 DU-BE-801）
# 购物车无 RDBMS 数据源：测试 classpath 经 mall-common-test 带 H2，
# 显式排除数据源自动装配，避免无用内嵌库；Redis 连接由各测试经
# Testcontainers @DynamicPropertySource 注入，自动装配本身为懒连接。
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  cloud:
    nacos:
      discovery:
        enabled: false
