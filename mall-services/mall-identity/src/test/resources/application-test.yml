# test profile：H2 内存库（MySQL 兼容模式）承载冒烟测试，验证数据源/Flyway 配置工程正确性
spring:
  datasource:
    url: jdbc:h2:mem:mall_identity_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    nacos:
      discovery:
        enabled: false
