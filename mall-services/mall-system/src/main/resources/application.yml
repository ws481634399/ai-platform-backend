spring:
  application:
    name: mall-system

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB_SYSTEM:mall_system}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration

  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:}
      discovery:
        enabled: ${NACOS_ENABLED:false}

  # CHG-0022：配置共享缓存（与消费服务同 Redis 实例，key 前缀隔离 env）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8108

# CHG-0022：管理端 JWT 鉴权 + 服务间 X-Internal-Token
mall:
  security:
    jwt:
      issuer: ${JWT_ISSUER:ai-platform}
      audience: ${JWT_AUDIENCE:mall-admin-api}
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
    internal:
      shared-secret: ${MALL_INTERNAL_SHARED_SECRET:dev-internal-secret}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{40} - %msg%n"
